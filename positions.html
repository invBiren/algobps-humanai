const API_BASE = 'http://127.0.0.1:8000';
<!DOCTYPE html>
<html>
<head>
<title>Positions</title>
<style>
body{font-family:Arial;padding:20px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px}
button{padding:5px}
#conn{position:fixed;top:5px;right:10px}
</style>
</head>
<body>

<div id="conn"></div>
<h2>Positions</h2>

<table>
<thead>
<tr><th>Symbol</th><th>Qty</th><th>PnL</th><th>SL</th><th>Action</th></tr>
</thead>
<tbody id="rows"></tbody>
</table>

<script>
const API="http://127.0.0.1:8000";

setInterval(()=>{
fetch(API+"/status").then(r=>r.json()).then(d=>{
conn.innerHTML=d.connected?"🟢 Connected":"🔴 Disconnected"
})
},2000)

function load(){
fetch(API+"/positions").then(r=>r.json()).then(d=>{
rows.innerHTML=""
d.forEach(p=>{
rows.innerHTML+=`
<tr>
<td>${p.symbol}</td>
<td>${p.qty}</td>
<td>${p.pnl}</td>
<td>${p.sl||""}</td>
<td>
<button onclick="square('${p.symbol}')">Square-off</button>
</td>
</tr>`
})
})
}
function square(sym){
fetch(API+"/squareoff",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({symbol:sym})})
}
load()
setInterval(load,3000)
</script>

</body>
</html>
